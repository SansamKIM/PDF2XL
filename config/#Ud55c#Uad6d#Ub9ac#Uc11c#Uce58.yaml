id: 한국리서치
기관명: 한국리서치
별칭:
  - "(주)한국리서치"
  - "Hankook Research"
  - "KBS-한국리서치"
  - "KBS 한국리서치"
지원항목: [PSR, GE, ISSUE]

# ----------------------------
# 목차(TOC)
# - KBS-한국리서치 결과표는 보통
#   1p 표지 → 2p 조사개요 → 3p 목차 → (응답자 분포표/응답자 특성) → 표 1...
# - 목차의 페이지 번호는 '응답자 분포표(1)=1' 기준으로 시작하므로, 실제 PDF 페이지로는 +3 오프셋이 필요합니다.
# ----------------------------
목차:
  섹션필터: |
    - items에는 목차에 나열된 실제 결과표(보통 "표 1", "표 2" ... 또는 "[표 1]" ...)만 포함하세요.
    - 아래 항목은 items에서 제외하세요.
      * 응답자 분포표, 조사완료 응답자 특성, 조사 개요, 조사개요, 표지/요약/부록 성격의 항목
    - 응답자특성페이지는 목차에 '응답자 특성' 또는 '응답자특성'이라는 항목이 **명시된 경우에만** 설정하세요.
      (즉, '응답자 분포표'는 응답자특성페이지로 취급하지 마세요.)

  전국:
    있음: true
    페이지: 3
    페이지오프셋: 3

  지방:
    있음: true
    페이지: 3
    페이지오프셋: 3

# 목차 파싱이 실패할 때를 대비한 메타/권역 페이지 폴백
조사설계:
  전국:
    페이지: 2
  지방:
    페이지: 2

# 지방(지역)조사는 조사개요 페이지에 '권 역 권역 구분' 표가 같이 있는 경우가 많습니다.
권역설명:
  지방:
    페이지: 2
    조사설계와함께: true

메타데이터:
  필드:
    - 표본크기
    - 표본오차
    - 조사방법
    - 조사기간
    - 조사기관
    - 의뢰기관
    - 응답률

# ----------------------------
# 포함/제외 그룹(LLM 프롬프트용)
# - 직업별은 (이번 자료 기준) 없거나 템플릿에 기입하지 않기로 했으므로 제외
# ----------------------------
전국:
  페이지수: 1
  포함:
    - 전체
    - 지역별
    - 거주지역
    - 성별
    - 연령
    - 연령별
    - 이념 성향
    - 이념성향별
  제외:
    - 직업별
    - 학력별
    - 종교별
    - 경제적
    - 계층
    - 지지정당별
    - 국정운영평가별

지방:
  페이지수: 1
  포함:
    - 전체
    - 성별
    - 연령
    - 연령별
    - 지역별
    - 권역
    - 권역별
  제외:
    - 직업별
    - 학력별
    - 종교별
    - 이념성향별
    - 정치성향별
    - 지지정당별

# ----------------------------
# 용어/라벨 정규화
# - 참고: 용어매핑은 분류/응답 구분 없이 "카테고리키"와 "응답항목"에 모두 적용됩니다.
# ----------------------------
용어매핑:
  분류:
    # 전국 지역 표기 흔들림(띄어쓰기)
    "인천 경기": "인천/경기"
    "대전 세종 충청": "대전/세종/충청"
    "광주 전라": "광주/전라"
    "대구 경북": "대구/경북"
    "부산 울산 경남": "부산/울산/경남"
    "강원 제주": "강원/제주"

    # 무응답 계열
    "모름/무응답": "모름.무응답"
    "모름/응답거절": "모름.무응답"
    "응답거절": "모름.무응답"

  응답:
    # 정당명 띄어쓰기/줄바꿈 흔들림 보정
    "더불어 민주당": "더불어민주당"
    "국민의 힘": "국민의힘"
    "조국 혁신당": "조국혁신당"
    "개혁 신당": "개혁신당"

    # 띄어쓰기 흔들림
    "다른사람": "다른 사람"

    # 무응답 계열
    "모름/무응답": "모름.무응답"
    "모름/응답거절": "모름.무응답"
    "응답거절": "모름.무응답"

# 강원/제주가 분리 제공되는 경우 템플릿의 '강원/제주'로 합산
지역합산:
  - from: ["강원", "제주"]
    to: "강원/제주"
