id: "코리아리서치인터내셔널"
기관명: "코리아리서치인터내셔널"
별칭:
  - "(주)코리아리서치인터내셔널"
  - "코리아리서치"
  - "KRI"
  - "KRI 코리아리서치"
지원항목:
  - "PSR"
  - "GE"
  - "ISSUE"

# KRI 통계표는 보통 1) 조사 설계(3p) 2) 표 목차(4p) 3) 조사완료 응답자 특성(6p) 이후 표가 이어집니다.
목차:
  섹션필터: |
    - items에는 표 목차에 있는 "조사 결과" 표만 포함하세요.
    - "<표 0> 조사완료 응답자 특성"은 items에서 제외하세요. (단, 응답자특성페이지에는 그 페이지 번호를 넣으세요.)
  전국:
    있음: true
    페이지: 4
    페이지오프셋: 0
  지방:
    있음: true
    페이지: 4
    페이지오프셋: 0

조사설계:
  전국:
    페이지: 3
  지방:
    페이지: 3

# 지방(지역)조사는 권역설명 페이지가 따로 없는 경우가 많아, "조사완료 응답자 특성" 표(보통 6p)를 권역 목록 추출용으로 사용합니다.
권역설명:
  전국:
    페이지: 3
    조사설계와함께: true
  지방:
    페이지: 6
    조사설계와함께: false

메타데이터:
  필드:
    - "표본크기"
    - "표본오차"
    - "조사방법"
    - "조사기간"
    - "조사기관"
    - "응답률"

# 전국(정기/전국현안 등) 통계표는 분류가 매우 많아 템플릿과 1:1로 맞는 분류만 포함시키도록 유도합니다.
전국:
  페이지수: 1
  포함:
    - "전체"
    - "지역별"
    - "성별"
    - "연령별"
    - "이념성향별"
    - "직업별"
  제외:
    - "학력별"
    - "종교별"
    - "정당지지도별"
    - "후보지지층별"
    - "투표참여"
    - "국정운영평가별"

# 지방(지역) 통계표는 최소 분류(전체/성별/연령별/지역별)만 사용합니다.
지방:
  페이지수: 1
  포함:
    - "전체"
    - "지역별"
    - "성별"
    - "연령별"
  제외:
    - "학력별"
    - "이념성향별"
    - "직업별"
    - "정당지지도별"
    - "후보지지층별"

# 강원, 제주가 분리되어 제공되는 경우가 많아(전국 통계표) 템플릿의 "강원/제주" 행으로 합산합니다.
지역합산:
  - from: ["강원", "제주"]
    to: "강원/제주"

# 기관별 표현 차이(특히 권역/직업 분류명) 보정
용어매핑:
  분류:
    "대전/충청(세종)": "대전/세종/충청"
    "대전/충청 (세종)": "대전/세종/충청"
    "농/임/어/축": "농/임/어업"
    "관리/사무": "화이트칼라"
    "사무/관리": "화이트칼라"
    "생산/기능/노무": "블루칼라"
    "기능노무/서비스": "블루칼라"
    "은퇴/무직/기타": "은퇴.무직"
    "무직/은퇴/기타": "은퇴.무직"
