id: 엠브레인퍼블릭
기관명: 엠브레인퍼블릭
별칭:
  - "㈜엠브레인퍼블릭"
  - "(주)엠브레인퍼블릭"
  - "엠브레인 퍼블릭"
  - "Mbrain Public"
  - "MBrain Public"
지원항목: [PSR, GE, ISSUE]

# ------------------------------------------------------------
# 목차 없음
# - News1 / YTN 통계표는 목차가 없는 경우가 많아 페이지 순회 모드 사용
# ------------------------------------------------------------
목차:
  전국:
    있음: false
  지방:
    있음: false

# ------------------------------------------------------------
# 조사설계(조사개요) 페이지
# - 대부분 2페이지에 위치
# ------------------------------------------------------------
조사설계:
  전국:
    페이지: 2
  지방:
    페이지: 2

# ------------------------------------------------------------
# 권역설명(지방만)
# - News1 지방 통계표의 권역 구분은 보통 '응답자 특성' 페이지(고정 4p)에 함께 포함
# ------------------------------------------------------------
권역설명:
  지방:
    페이지: 4


# ------------------------------------------------------------
# (목차 없는 기관용) 페이지 순회
# - 1p: 표지, 2p: 조사개요, 3p: 첨부(통계표) 이후 표가 시작하는 경우가 많아 4p부터 순회
# - 끝=-1 은 PDF 마지막 페이지까지
# ------------------------------------------------------------
페이지순회:
  전국:
    시작: 4
    끝: -1
  지방:
    시작: 4
    끝: -1

# ------------------------------------------------------------
# 페이지 스킵(프롬프트용)
# - 응답자특성/표본 분포/가중값 기준 페이지는 교차분석표가 아니므로 SKIP 유도
#   ※ '통계표' 같은 공통 단어는 모든 페이지에 등장할 수 있어 넣지 않음
# ------------------------------------------------------------
페이지스킵:
  키워드:
    - "응답자 특성"
    - "응답자특성"
    - "조사 완료/가중값 적용 기준"
    - "가중값 적용 기준"
    - "표본 분포"
    - "표본분포"
    - "결과 요약"
    - "추이"

# ------------------------------------------------------------
# 유형 판단(페이지 순회 auto-type용)
# - '국정운영 성과 분야'처럼 '국정+운영'이 들어가지만
#   실제로는 평가(잘함/못함) 분포표가 아니라 분야/정책 선택형 문항이 존재함.
# - 이런 경우 GE로 분류되면 GE 프롬프트(3열 고정)로 인해 응답항목이 유실되므로
#   특정 패턴은 ISSUE로 강제한다.
# ------------------------------------------------------------
유형판단:
  규칙:
    GE:
      제외:
        - "성과 분야"
        - "성과분야"
        - "잘한 분야"

# ------------------------------------------------------------
# 메타데이터 필드
# ------------------------------------------------------------
메타데이터:
  필드:
    - 표본크기
    - 표본오차
    - 조사방법
    - 조사기간
    - 조사기관
    - 응답률

# ------------------------------------------------------------
# 포함/제외 분류(프롬프트용)
# ------------------------------------------------------------
전국:
  페이지수: 1
  포함:
    - 전체
    - 지역별
    - 거주지역
    - 성별
    - 연령
    - 연령별
    - 직업별
    - 이념성향
    - 이념성향별
  제외:
    - "성×연령"
    - "성 by 연령"
    - "연령 by 성"
    - "지지정당별"
    - "정당지지도별"
    - "국정운영평가별"
    - "대선"
    - "투표"
    - "가상"
    - "대결"
    - "추이"

지방:
  페이지수: 1
  포함:
    - 전체
    - 권역
    - 권역별
    - 지역별
    - 성별
    - 연령
    - 연령별
    - 직업별
    - 이념성향
    - 이념성향별
  제외:
    - "성×연령"
    - "성 by 연령"
    - "연령 by 성"
    - "지지정당별"
    - "정당지지도별"
    - "국정운영평가별"
    - "대선"
    - "투표"
    - "가상"
    - "대결"
    - "추이"

# ------------------------------------------------------------
# 용어/라벨 정규화 (기관/문서 특이 케이스 보정)
# - 참고: 용어매핑은 분류/응답 구분 없이 JSON 전체 문자열에 적용됩니다.
# ------------------------------------------------------------
용어매핑:
  all:
    # 이념성향별 무응답 표기
    "거절/모름/무응답": "모름.무응답"

    # 직업별 무응답 표기
    "거절/무응답": "밝힐 수 없음"

    # 잘모름 계열 (특히 PSR에서 '모르겠다/무응답' 형태)
    "모르겠다/무응답": "잘 모름"
    "모르겠다 /무응답": "잘 모름"
    "잘 모르겠다/무응답": "잘 모름"
    "잘 모르겠다 /무응답": "잘 모름"
    "잘모르겠다/무응답": "잘 모름"

    # 위 매핑이 부분 적용되며 '잘 모름/무응답' 형태가 남는 경우 방어
    "잘 모름/무응답": "잘 모름"
    "잘 모름 /무응답": "잘 모름"

    "모르겠다": "잘 모름"
    "잘 모르겠다": "잘 모름"
    "잘모르겠다": "잘 모름"
