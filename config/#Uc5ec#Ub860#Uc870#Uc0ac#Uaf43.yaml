# 여론조사꽃 설정

기관명: "(주)여론조사꽃"

# 지원하는 추출 항목
지원항목:
  - PSR   # 정당지지도
  - GE    # 국정운영평가
  - ISSUE # 이슈

# 목차 설정
목차:
  있음: true
  페이지: 2
  페이지오프셋: 1  # 목차 페이지번호 + 1 = PDF 페이지
  섹션필터: |
    제2장 "결과표" 아래 항목만 추출.
    - 제1장(조사개요) 및 별첨(설문지/통합표 등) 제외
    - 각 항목은 "시작 페이지"만 items로 만들 것
      예: 정당지지도는 시작 페이지 7만, 정당지지도(2)/(3) 같은 후속 페이지는 items로 만들지 않음
    - 항목명에서 "(1)", "(2)", "(3)" 같은 접미어는 제거

# 조사설계 페이지
조사설계:
  페이지: 4

# 권역 설명 (지방선거용)
권역설명:
  페이지: 5

# 메타데이터 필드
메타데이터:
  필드:
    - 표본크기 (숫자만)
    - 표본오차
    - 조사방법
    - 조사기간
    - 조사기관
    - 응답률

# 전국 정기조사
전국:
  페이지수: 2
  포함:
    - 전체
    - 지역별
    - 성별
    - 연령별
    - 이념성향별
    - 직업별
  제외:
    - 연령대 by 성별
    - 정당지지도별
    - 국정평가별
    - 추이
    - 비교

# 지방선거
지방:
  페이지수: 1
  포함:
    - 전체
    - 지역별
    - 권역별
    - 성별
    - 연령별
  제외:
    - 연령대 by 성별
    - 정당지지도별
