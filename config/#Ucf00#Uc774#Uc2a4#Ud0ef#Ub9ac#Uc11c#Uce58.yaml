id: 케이스탯리서치
기관명: 케이스탯리서치
별칭:
  - "(주)케이스탯리서치"
  - "㈜케이스탯리서치"
  - "Kstat"
  - "케이스탯"
  - "KBS-케이스탯리서치"
  - "KBS 케이스탯리서치"
지원항목: [PSR, GE, ISSUE]

# -----------------------------------------------------------------------------
# 목차(TOC)
# - 케이스탯리서치 통계표는 보통
#   1p 표지 → 2p 일러두기 → 3p 조사개요 → 4p 목차 → (응답자 분포표/응답자 특성) → 표 1...
# - 목차의 페이지 번호는 '응답자 분포표(1)=1' 기준으로 시작하므로, 실제 PDF 페이지로는 +4 오프셋이 필요합니다.
# -----------------------------------------------------------------------------
목차:
  섹션필터: |
    - items에는 목차에 나열된 실제 결과표(보통 "표 1", "표 2" ... 또는 "[표 1]" ...)만 포함하세요.
    - 아래 항목은 items에서 제외하세요.
      * 응답자 분포표, 조사완료 응답자 특성, 조사 개요, 조사개요, 표지/요약/부록 성격의 항목
    - 응답자특성페이지는 목차에 '응답자 특성' 또는 '응답자특성'이라는 항목이 **명시된 경우에만** 설정하세요.
      (즉, '응답자 분포표'는 응답자특성페이지로 취급하지 마세요.)

  전국:
    있음: true
    페이지: 4
    페이지오프셋: 4

  지방:
    있음: true
    페이지: 4
    페이지오프셋: 4

# 목차 파싱 실패 대비 조사개요(메타) 페이지 폴백
조사설계:
  전국:
    페이지: 3
  지방:
    페이지: 3

# 권역설명(지역)
# - 케이스탯리서치 '지방선거 관련 여론조사(서울/부산)' 자료는
#   실제 PDF의 **응답자 분포표(1)** 하단에 "*1권역 : ..." 형태로 권역 구분을 표기합니다.
# - LLM/TOC가 응답자특성페이지를 제공하지 않는 경우가 있어, 여기서 PDF 페이지를 고정 지정합니다.
# - (정책) 표 행 라벨 우선이므로, 이 값은 "없어도" 동작해야 하지만,
#   있으면 권역설명.json 품질이 좋아집니다.
권역설명:
  지방:
    페이지: 5

메타데이터:
  필드:
    - 표본크기
    - 표본오차
    - 조사방법
    - 조사기간
    - 조사기관
    - 의뢰기관
    - 응답률

# -----------------------------------------------------------------------------
# 포함/제외 그룹(LLM 프롬프트용)
# - 케이스탯리서치 표에는 '직업' 분류가 존재하므로 **포함**합니다. (전국 템플릿 PSR/GE에 매핑)
# -----------------------------------------------------------------------------
전국:
  페이지수: 1
  포함:
    - 전체
    - 지역별
    - 거주지역
    - 성별
    - 연령
    - 연령별
    - 이념 성향
    - 이념성향별
    - 직업
    - 직업별
  제외:
    - 지지정당
    - 지지정당별
    - 학력
    - 학력별
    - 종교
    - 종교별
    - 경제적
    - 계층


지방:
  페이지수: 1
  포함:
    - 전체
    - 성별
    - 연령
    - 연령별
    - 지역별
    - 권역
    - 권역별
  제외:
    - 직업
    - 직업별
    - 학력
    - 학력별
    - 종교
    - 종교별
    - 이념성향별
    - 정치성향별
    - 지지정당별
    - 경제적
    - 계층

# -----------------------------------------------------------------------------
# 용어/라벨 정규화
# -----------------------------------------------------------------------------
용어매핑:
  분류:
    # 전국 지역 표기 흔들림(띄어쓰기/슬래시)
    "인천 경기": "인천/경기"
    "인천 경기/": "인천/경기"
    "인천/경기": "인천/경기"

    "대전 세종 충청": "대전/세종/충청"
    "대전 세종 충청/": "대전/세종/충청"
    "대전/세종/충청": "대전/세종/충청"

    "광주 전라": "광주/전라"
    "광주 전라/": "광주/전라"
    "광주/전라": "광주/전라"

    "대구 경북": "대구/경북"
    "대구 경북/": "대구/경북"
    "대구/경북": "대구/경북"

    "부산 울산 경남": "부산/울산/경남"
    "부산 울산 경남/": "부산/울산/경남"
    "부산/울산/경남": "부산/울산/경남"

    "강원 제주": "강원/제주"
    "강원 제주/": "강원/제주"
    "강원/제주": "강원/제주"

    # 무응답 계열
    "모름/무응답": "모름.무응답"
    "모름 무응답": "모름.무응답"
    "모름 무응답/": "모름.무응답"
    "모름/응답거절": "모름.무응답"
    "응답거절": "모름.무응답"

  응답:
    # 정당명 띄어쓰기/줄바꿈 흔들림 보정
    "더불어 민주당": "더불어민주당"
    "국민의 힘": "국민의힘"
    "조국 혁신당": "조국혁신당"
    "개혁 신당": "개혁신당"

    # 무응답 계열
    "모름/무응답": "모름.무응답"
    "모름 무응답": "모름.무응답"
    "모름 무응답/": "모름.무응답"
    "모름/응답거절": "모름.무응답"
    "응답거절": "모름.무응답"

# 강원/제주가 분리 제공되는 경우 템플릿의 '강원/제주'로 합산
지역합산:
  - from: ["강원", "제주"]
    to: "강원/제주"

# -----------------------------------------------------------------------------
# 특수 프롬프트/검증 (기관 한정)
# - 정당지지도(PSR) 표는 열이 매우 촘촘하여, 비전 모델이 열을 한 칸씩 밀어 읽는
#   오류가 반복됩니다.
# - 이 기관에서는 정당지지도(PSR)에 한해 'columns + values 배열' 스키마를 사용해
#   열-값 정렬을 강제합니다.
# -----------------------------------------------------------------------------
특수프롬프트:
  PSR:
    정당지지도: columns_values_v1

특수검증:
  PSR:
    정당지지도:
      행합계허용오차: 5
      # 최소한 '지지정당없음(=지지하는 정당이 없다/지지 정당 없음)' 열이
      # 전체 행 데이터에서 누락되지 않도록 강제합니다.
      필수열:
        - 지지정당없음
