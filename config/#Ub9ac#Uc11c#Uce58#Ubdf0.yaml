# 리서치뷰 설정
# 목차 없음 → 초기 스캔으로 교차분석 시작 페이지를 찾고, 이후 페이지를 순회하며 추출

기관명: "리서치뷰"

# 지원하는 추출 항목
지원항목:
  - PSR   # 정당지지도
  - GE    # 국정운영평가 (대통령 직무평가)
  - ISSUE # 이슈

# 목차 설정 - 리서치뷰는 목차 없음
목차:
  전국:
    있음: false
  지방:
    있음: false

# 초기 스캔 설정 (메타데이터 + 권역설명 + 교차분석 시작페이지 동시 추출)
# ※ 표본 분포(응답자특성) 페이지가 함께 들어가도 교차분석 시작을 안정적으로 찾도록
#    프롬프트를 강화(코드 패치)하는 전제의 범위
초기스캔:
  시작: 2
  끝: 8

# (목차 없는 기관용) 페이지 순회 시 "추출하지 말아야 할" 페이지 판별 키워드
# - 응답자특성(표본 분포), 추이(시계열) 페이지가 섞이는 경우를 방어
# - 동적 규칙이므로 같은 기관의 다른 보고서에도 그대로 적용 가능
페이지스킵:
  키워드:
    - "응답자특성"
    - "응답자 특성"
    - "결과 요약"
    - "추이"
    - "전망"

# 유형 판단 방식 (질문 기반)
유형판단:
  방식: "질문기반"
  규칙:
    GE:
      포함: ["직무수행", "직무평가", "국정수행", "국정운영"]
    PSR:
      # 리서치뷰는 질문이 "정당지지도(%)"처럼 짧게만 나오는 경우가 있어 포함 키워드에 넣어둠
      포함: ["정당지지도", "지지하거나", "호감", "지지하시는", "지지하는 정당"]
      # "정당지지도 추이" 같은 시계열 표는 추출 대상이 아니므로 제외
      제외: ["추이"]
    # 위 키워드에 해당하지 않으면 ISSUE

# 메타데이터 필드
메타데이터:
  필드:
    - 표본크기
    - 표본오차
    - 조사방법
    - 조사기간
    - 조사기관
    - 응답률

# 전국 조사 설정
전국:
  페이지수: 1  # 표 1개 = 1페이지

  # 표에서 "그룹"으로 등장하는 분류(왼쪽 큰 제목)만 포함하도록 유도
  포함:
    - 전체
    - 성별
    - 연령
    - 지역
    - 직업
    - 정치적 성향

  # 제외는 "행 라벨"이 아니라 "그룹/섹션"을 의미하도록 쓰는 편이 안전함
  # ("남성/여성"을 넣으면 성별 행 자체가 빠질 수 있어 사용하지 않음)
  제외:
    - "연령 내 성별 세분화"
    - "성별 하위 연령"
    - "정당지지도별"
    - "대통령 직무평가별"
    - "지방선거 프레임 공감도별"

# 지방 조사 설정 (리서치뷰 지방 자료가 들어올 때 대비)
지방:
  페이지수: 1
  포함:
    - 전체
    - 성별
    - 지역
    - 권역
    - 연령
  제외:
    - "연령 내 성별 세분화"
    - "성별 하위 연령"
    - "정당지지도별"
    - "구청장 직무평가별"
    - "다자대결별"
    - "더불어민주당 후보적합도별"
    - "비례대표 정당투표별"

# 용어 매핑 (엑셀 템플릿 표기와 다르게 추출되는 케이스 보정)
# - 키: AI가 뽑아낸 원문 라벨
# - 값: 템플릿/정규화가 기대하는 라벨
용어매핑:
  분류:
    # 이념성향 "모름/기타" 표기가 괄호 설명과 함께 붙는 경우
    "모름/기타(정치적 성향)": "모름.무응답"
    "모름/기타 (정치적 성향)": "모름.무응답"
    "모름/기타(정치성향)": "모름.무응답"
    "모름/기타 (정치성향)": "모름.무응답"
    "모름/기타(정치 성향)": "모름.무응답"
    "모름/기타 (정치 성향)": "모름.무응답"

    # 리서치뷰 지역 표기 흔들림
    "대전/세종/충청북/충청남": "대전/세종/충청"
    "대전/세종/충청북/충청남도": "대전/세종/충청"
    "대전/세종/충청북도/충청남도": "대전/세종/충청"

    # 연령 표기 흔들림(혹시 '18/20대'가 그대로 들어오면 템플릿 기준으로)
    "18/20대": "18~29세"

  응답:
    # 정당지지도에서 모름 표기(템플릿은 '잘 모름')
    "모름": "잘 모름"
    "잘모름": "잘 모름"


# -----------------------------------------------------------------------------
# 리서치뷰 PSR(정당지지도) 보강
# - 촘촘한 표에서 열 밀림/누락을 줄이기 위해 columns+values 스키마를 사용
# - 필수 열/행합계 검증으로 이상 추출 시 크롭/strict 재시도를 유도
# -----------------------------------------------------------------------------
특수프롬프트:
  PSR:
    정당지지도: columns_values_v1

특수검증:
  PSR:
    정당지지도:
      행합계허용오차: 5
      필수열:
        - 지지정당없음
        - 잘 모름
