# 한길리서치 설정

기관명: "한길리서치"

# 지원하는 추출 항목
지원항목:
  - PSR   # 정당지지도
  - GE    # 국정운영평가
  - ISSUE # 이슈

# 목차 설정 - 한길리서치는 목차 없음
목차:
  전국:
    있음: false
  지방:
    있음: false

# 페이지 순회 방식 (목차 없는 기관용)
페이지순회:
  전국:
    시작: 5
    끝: -1  # -1 = 마지막 페이지까지
  지방:
    시작: 5
    끝: -1

# 조사설계 페이지 (메타데이터)
조사설계:
  전국:
    페이지: 2
  지방:
    페이지: 2

# 권역 설명 (응답자 특성)
권역설명:
  전국:
    페이지: null  # 전국은 권역설명 없음
  지방:
    페이지: 3

# 유형 판단 방식 (질문 기반)
유형판단:
  방식: "질문기반"
  규칙:
    GE:
      포함: ["국정수행", "국정운영"]
      제외: ["향후", "전망"]
    PSR:
      포함: ["지지하시는 당", "지지하는 정당"]
    # 위 키워드에 해당하지 않으면 ISSUE

# 메타데이터 필드
메타데이터:
  필드:
    - 표본크기
    - 표본오차
    - 조사방법
    - 조사기간
    - 조사기관
    - 응답률

# 전국 조사 설정
전국:
  페이지수: 1  # 표 1개 = 1페이지
  포함:
    - 전체
    - 광역지역별
    - 지역별
    - 성별
    - 연령별
    - 정치 성향별
    - 직업별
  제외:
    - 지지정당별
    - 대통령 국정지지별
    - 향후 국정수행 전망별
    - 학력별
    - 경제적 계층별

# 지방 조사 설정
지방:
  페이지수: 1
  포함:
    - 전체
    - 권역별
    - 성별
    - 연령별
    - 정치 성향별
    - 직업별
  제외:
    - 지지정당별
    - 대통령 국정지지별
    - 향후 국정수행 전망별
    - 학력별
    - 경제적 계층별
