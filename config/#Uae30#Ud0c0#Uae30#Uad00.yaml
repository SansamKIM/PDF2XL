# -----------------------------------------------------------------------------
# 기타기관(명시된 기관 이외) 설정
# - 기관/문서마다 조사설계(조사개요)·응답자특성(권역설명)·교차분석 시작 페이지가 고정이 아닌 경우가 많음
# - TOC(목차) 유무도 불명확하므로, **목차 분석 없이** 초기 스캔으로 위치를 잡고 이후 페이지를 순회하며 추출
#   1) 초기스캔: 앞부분(기본 2~12p)에서 메타데이터/권역설명/교차분석 시작페이지를 추출
#   2) 페이지순회: 교차분석 시작페이지부터 마지막까지 순회하며 결과표(문항표) 추출
# -----------------------------------------------------------------------------

id: 기타기관
기관명: 기타기관

# 너무 일반적인 단어(예: "기타")를 별칭에 넣으면 자동감지 오탐이 늘 수 있어 지양
별칭:
  - "기타 기관"
  - "기타기관"
  - "Other 기관"
  - "Unknown 기관"

지원항목: [PSR, GE, ISSUE]

# -----------------------------------------------------------------------------
# 목차(TOC)
# - 기타기관은 목차 유무/형식이 불명확하므로 TOC 모드 사용 안 함
# -----------------------------------------------------------------------------
목차:
  전국:
    있음: false
  지방:
    있음: false

# -----------------------------------------------------------------------------
# 초기 스캔(메타데이터 + 권역설명 + 교차분석 시작페이지)
# - 시작/끝 페이지는 "표가 어디서 시작하는지"를 기관별로 다르게 잡기 어려우므로 보수적으로 넓게 설정
# - 필요 시 끝을 10/15 등으로 조정
# -----------------------------------------------------------------------------
초기스캔:
  시작: 2
  끝: 12

# -----------------------------------------------------------------------------
# 페이지 스킵(프롬프트용)
# - 교차분석 문항표가 아닌 페이지(조사개요/응답자특성/요약/추이/부록 등)를 SKIP 유도
# -----------------------------------------------------------------------------
페이지스킵:
  키워드:
    - "응답자 특성"
    - "응답자특성"
    - "표본 분포"
    - "표본분포"
    - "조사 개요"
    - "조사개요"
    - "조사 설계"
    - "조사설계"
    - "결과 요약"
    - "요약"
    - "추이"
    - "부록"
    - "설문지"

# -----------------------------------------------------------------------------
# 유형판단(페이지 순회 auto-type용)
# - 기본 규칙은 코드 기본값을 따르되, 자주 발생하는 오분류만 방어
# -----------------------------------------------------------------------------
유형판단:
  규칙:
    GE:
      # "국정운영"이 포함되어도 실제로는 '성과/정책 분야 선택' 문항(ISSUE)인 경우가 있어 방어
      제외:
        - "성과 분야"
        - "성과분야"
        - "잘한 분야"
        - "잘한분야"
    PSR:
      포함:
        - "정당 지지도"
        - "정당지지도"
        - "지지하시는 정당"
        - "지지하는 정당"
        - "어느 정당"
      제외:
        - "추이"

# -----------------------------------------------------------------------------
# 메타데이터 필드 (초기스캔 프롬프트에서 사용)
# -----------------------------------------------------------------------------
메타데이터:
  필드:
    - 표본크기
    - 표본오차
    - 조사방법
    - 조사기간
    - 조사기관
    - 의뢰기관
    - 응답률

# -----------------------------------------------------------------------------
# 포함/제외 분류(LLM 프롬프트용)
# - 템플릿에 반영되지 않는 과도한 교차분석/세부분류는 제외로 유도
# -----------------------------------------------------------------------------
전국:
  페이지수: 1
  포함:
    - 전체
    - 지역별
    - 거주지역
    - 권역
    - 권역별
    - 성별
    - 연령
    - 연령별
    - 직업별
    - 이념성향
    - 이념성향별
    - 정치성향
    - 정치 성향별
  제외:
    - "성×연령"
    - "성 by 연령"
    - "연령 by 성"
    - "지지정당별"
    - "정당지지도별"
    - "국정운영평가별"
    - "후보지지도별"
    - "가상"
    - "대결"
    - "추이"

지방:
  페이지수: 1
  포함:
    - 전체
    - 지역별
    - 권역
    - 권역별
    - 성별
    - 연령
    - 연령별
    - 직업별
    - 이념성향
    - 이념성향별
    - 정치성향
    - 정치 성향별
  제외:
    - "성×연령"
    - "성 by 연령"
    - "연령 by 성"
    - "지지정당별"
    - "정당지지도별"
    - "국정운영평가별"
    - "후보지지도별"
    - "가상"
    - "대결"
    - "추이"

# -----------------------------------------------------------------------------
# 용어/라벨 정규화
# -----------------------------------------------------------------------------
용어매핑:
  분류:
    # 무응답 계열
    "모름/무응답": "모름.무응답"
    "모름/응답거절": "모름.무응답"
    "응답거절": "모름.무응답"

    # 전국 지역 표기 흔들림(띄어쓰기)
    "인천 경기": "인천/경기"
    "대전 세종 충청": "대전/세종/충청"
    "광주 전라": "광주/전라"
    "대구 경북": "대구/경북"
    "부산 울산 경남": "부산/울산/경남"
    "강원 제주": "강원/제주"

  응답:
    # 정당명 띄어쓰기/줄바꿈 흔들림 보정
    "더불어 민주당": "더불어민주당"
    "국민의 힘": "국민의힘"
    "조국 혁신당": "조국혁신당"
    "개혁 신당": "개혁신당"

    # 기타 정당 표현 통일
    "기타정당": "그 외 다른 정당"
    "기타 정당": "그 외 다른 정당"
    "그외정당": "그 외 다른 정당"

    # 무응답 계열
    "모름/무응답": "모름.무응답"
    "모름/응답거절": "모름.무응답"
    "응답거절": "모름.무응답"

# 강원/제주가 분리 제공되는 경우 템플릿의 '강원/제주'로 합산
지역합산:
  - from: ["강원", "제주"]
    to: "강원/제주"
