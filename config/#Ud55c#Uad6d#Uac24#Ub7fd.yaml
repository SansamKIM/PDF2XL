id: 한국갤럽
기관명: 한국갤럽
별칭:
  - Gallup
  - Gallup Korea
  - 한국갤럽 데일리 오피니언
  - 갤럽
지원항목: [PSR, GE, ISSUE]

# ----------------------------
# 목차(TOC)
# - 전국 데일리 오피니언 [교차집계표]: 1페이지 커버에 "→ p." 형태의 섹션/페이지 표기가 있음
#   → 여기서 PSR/GE만 뽑아서 불필요 표(최근 6개월+, 전직 대통령 공과, 어떤 점에서~, 호감도 요약 등) 스킵
# - 지방 통계표/결과집계표: 2페이지에 목차가 있고, 인쇄 페이지(1,2,3,...) 기준이라 +3 오프셋
# ----------------------------
목차:
  섹션필터: |
    - 한국갤럽 PDF의 목차 페이지(1장)에서 항목명과 시작 페이지를 추출합니다.
    - 먼저 페이지 레이아웃을 판별하세요.

      [A] 전국 정기(데일리 오피니언 [교차집계표]) 커버
        - 특징: "→ p.10 ... | → p.12 ..." 형태의 섹션/페이지 표기가 있음.
        - 이 경우:
          * 조사설계페이지: 1
          * 응답자특성페이지: 4
          * items에는 아래 2개만 포함(그 외는 전부 제외)
            1) 대통령 직무 수행 평가 : 커버에 적힌 "→ p.XX 대통령 직무 수행 평가"의 XX (그대로)
            2) 정당 지지도 : 커버에 적힌 "→ p.XX 정당 지지도"의 XX + 1
               (XX 페이지는 '정당 지지도: 최근 6개월' 추이표라 스킵, 교차집계표는 바로 다음 페이지)
          * 아래 키워드가 포함된 섹션은 절대 items에 넣지 마세요.
            - 전직 대통령, 공과, 주요 지표, 지표, 추이, 최근 6개월, 통합 교차집계표, 호감도, 요약, 어떤 점에서, 자유응답, 평가 이유

      [B] 지방/지역 통계표(결과집계표/통계표) 목차
        - 특징: "표 1. ... 5" 형태의 표 목록과 페이지가 나열됨.
        - 이 경우:
          * 조사설계페이지: 목차의 "조사 개요" 또는 "조사개요"에 적힌 페이지 번호
          * 응답자특성페이지: 목차의 "응답자 특성표" 또는 "응답자특성표"에 적힌 페이지 번호(가능하면)
          * items에는 "표"로 시작하는 실제 결과표만 포함
          * items에서 제외: 조사 개요, 응답자 특성표, 조사완료 응답자 특성표, 표지/요약/부록 성격의 항목

    - 항목명(name)은 번호(예: '표 1.', '1.', '②')를 제거하고 제목만 남기세요.
    - page는 숫자만 사용하세요.

    출력은 반드시 아래 JSON 형식으로만 하세요(추가 텍스트 금지).
    {
      "조사설계페이지": <int or null>,
      "응답자특성페이지": <int or null>,
      "items": [
        {"name": "...", "page": <int>}
      ]
    }

  전국:
    있음: true
    페이지: 1
    페이지오프셋: 0
    right_half_crop: true

  지방:
    있음: true
    페이지: 2
    페이지오프셋: 3

# ----------------------------
# 기본 메타/권역 페이지(목차 파싱 실패시 폴백)
# ----------------------------
조사설계:
  전국:
    페이지: 1
  지방:
    페이지: 4

권역설명:
  지방:
    페이지: 5

메타데이터:
  필드:
    - 표본크기
    - 표본오차
    - 조사방법
    - 조사기간
    - 조사기관
    - 의뢰기관
    - 응답률

# ----------------------------
# 유형판단(오분류 방지)
# ----------------------------
유형판단:
  규칙:
    GE:
      제외:
        - 도지사
        - 시장
        - 구청장
        - 군수
        - 교육감
        - 시정
        - 도정
        - 단체장
    PSR:
      포함:
        - 정당 지지도
        - 어느 정당
        - 지지하십니까
        - 지지하는 정당
      제외:
        - 후보
        - 가상대결
        - 양자
        - 다자

# ----------------------------
# 포함/제외 그룹(LLM 프롬프트용)
# ----------------------------
전국:
  페이지수: 1
  포함:
    - 전체
    - 지역별
    - 성별
    - 연령별
    - 직업별
    - 이념성향별
    - 정치성향별
    - 정치 성향별
    - 성향별
  제외:
    - 학력별
    - 생활수준별
    - 주관적
    - 지지정당별
    - 투표
    - 선거관심
    - 관심도별
    - 종교
    - 결혼
    - 가구
    - 표준오차
    - 신뢰구간
    # 전국 정기 스킵 대상(프롬프트 보조)
    - 전직 대통령
    - 공과
    - 호감도
    - 요약
    - 어떤 점에서
    - 추이
    - 최근 6개월
    - 주요 지표
    - 통합 교차집계표

지방:
  페이지수: 1
  포함:
    - 전체
    - 성별
    - 연령별
    - 지역별
    - 권역별
  제외:
    - 직업별
    - 지지정당별
    - 이념성향별
    - 정치성향별
    - 정치 성향별
    - 성향별

# ----------------------------
# 추가 지침(기관별 프롬프트 힌트)
# ----------------------------
추가지침:
  GE: |
    - GE 응답항목은 최종 3개(잘하고 있다 / 잘못하고 있다 / 잘 모름·응답거절)만 적어 주세요.
    - 원표에 '어느 쪽도 아님'과 '모름/응답거절'이 따로 있으면 합산해 잘 모름·응답거절에 넣고, 개별 항목은 출력하지 마세요. 추정/임의 계산은 금지입니다.

# ----------------------------
# 용어/라벨 정규화
# - 참고: 용어매핑은 분류/응답 구분 없이 "카테고리키"와 "응답항목"에 모두 적용됨
# ----------------------------
용어매핑:
  분류:
    # 무응답 계열
    "모름/응답거절": "잘 모름"
    "응답거절": "잘 모름"

    # (데일리 오피니언) 주관적 정치 성향 5점 척도 → 3분류로 축약
    "매우 보수적": "보수"
    "다소 보수적": "보수"
    "약간 보수적": "보수"
    "매우 진보적": "진보"
    "다소 진보적": "진보"
    "약간 진보적": "진보"

    # (교차집계표) 3분류 표기(괄호/합산 표기)
    "(매우+약간) 보수": "보수"
    "(매우+약간) 진보": "진보"
    "중도적": "중도"
    "중도층": "중도"

    # 직업 표기(갤럽 고유)
    "사무/관리": "화이트칼라"
    "사무·관리": "화이트칼라"
    "사무 관리": "화이트칼라"
    "기능노무/서비스": "블루칼라"
    "기능노무·서비스": "블루칼라"
    "기능/노무/서비스": "블루칼라"
    "기능노무 서비스": "블루칼라"
    "무직/은퇴/기타": "은퇴.무직"
    "무직 은퇴 기타": "은퇴.무직"

    # 지역 표기 변형(기관/AI 흔들림 보정)
    "대전/세종/충남북": "대전/세종/충청"
    "대전/세종/충남/북": "대전/세종/충청"
    "대전/세종/충청남북": "대전/세종/충청"
    "광주/전남북": "광주/전라"
    "광주/전남/북": "광주/전라"

    # 직업 표기 변형(다른 기관에도 자주 등장)
    "농림축수산업": "농/임/어업"
    "농림축산업": "농/임/어업"
    "농 임 어업": "농/임/어업"

  응답:
    # 정당명 띄어쓰기/줄바꿈 흔들림 보정
    "더불어 민주당": "더불어민주당"
    "국민의 힘": "국민의힘"
    "조국 혁신당": "조국혁신당"
    "개혁 신당": "개혁신당"
    "기본 소득당": "기본소득당"
    "사회 민주당": "사회민주당"

    # 무응답
    "모름/응답거절": "잘 모름"
    "응답거절": "잘 모름"
    # PSR: '무당층'은 사용하지 않고, 잘 모름/없음 계열로 합치지 않음
    "무당층": null

# 지역 분리 표가 들어오는 경우 합산(전국 템플릿 기준)
지역합산:
  - from: ["강원", "제주"]
    to: "강원/제주"
