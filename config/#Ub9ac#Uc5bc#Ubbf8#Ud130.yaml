# 리얼미터 설정
id: "리얼미터"
기관명: "리얼미터"
별칭:
  - "(주)리얼미터"
  - "Realmeter"
  - "REALMETER"

# 지원하는 추출 항목
지원항목:
  - "PSR"
  - "GE"
  - "ISSUE"

# -----------------------------------------------------------------------------
# 목차/페이지 규칙
# -----------------------------------------------------------------------------
목차:
  # 목차 프롬프트 보조 규칙 (전국/지방 공통)
  섹션필터: |
    - items에는 "조사결과" 문항(후보지지도/적합도/가상대결/현안/정당지지도/국정(수행/운영)평가 등)만 포함하세요.
    - "조사 목적/조사 설계/조사 내용/응답자 특성/세부 응답자 특성/부록(설문지)" 항목은 items에서 제외하세요.
    - 응답자특성페이지는 "세부 응답자 특성"이 있으면 그 페이지 번호를 사용하고, 없으면 "응답자 특성" 페이지 번호를 사용하세요.

  # 전국: 목차 없이 고정 항목(정당지지도)만 추출
  전국:
    있음: false
    페이지오프셋: 0
    고정항목:
      정당지지도: 5

  # 지방: 목차 기반으로 문항 목록/메타/권역 페이지 추출
  지방:
    있음: true
    페이지: 3
    페이지오프셋: 0

# -----------------------------------------------------------------------------
# 메타데이터/권역(응답자특성) 페이지 (TOC가 있으면 TOC 값이 우선)
# -----------------------------------------------------------------------------
조사설계:
  전국:
    페이지: 2
  지방:
    페이지: 6   # 폴백: TOC에 조사설계페이지가 있으면 그 값을 사용

권역설명:
  전국:
    페이지: null
    조사설계와함께: true
  지방:
    페이지: 8   # 폴백: TOC에 응답자특성페이지가 있으면 그 값을 사용
    조사설계와함께: false

# 메타데이터 추출 필드
메타데이터:
  필드:
    - "표본크기"
    - "표본오차"
    - "조사방법"
    - "조사기간"
    - "조사기관"
    - "응답률"

# -----------------------------------------------------------------------------
# 표 추출 설정 (프롬프트의 포함/제외 분류 지시용)
# -----------------------------------------------------------------------------
전국:
  페이지수: 1
  포함:
    - "전체"
    - "지역별"
    - "성별"
    - "연령별"
    - "이념성향별"
    - "직업별"
  제외:
    - "연령대 by 성별"
    - "정당지지도별"
    - "국정평가별"

지방:
  # 리얼미터 지방 결과표는 문항 1개가 보통 2페이지(표 분할)로 구성되는 경우가 많음
  페이지수: 2
  포함:
    - "전체"
    - "지역별"
    - "성별"
    - "연령별"
  제외:
    - "연령대 by 성별"
    - "정당지지도별"

# -----------------------------------------------------------------------------
# 정규화/용어 매핑
# -----------------------------------------------------------------------------
용어매핑:
  응답:
    # 정당지지도 표에서 종종 제공되는 파생열(없음+잘모름 합산) → 템플릿/검증에 불필요하므로 제거
    "무당층": null
    # 기타 정당 표현 통일
    "기타정당": "그 외 다른 정당"
    "기타 정당": "그 외 다른 정당"
    "그외정당": "그 외 다른 정당"

# -----------------------------------------------------------------------------
# 전국 권역 합산(강원/제주)
#   - 리얼미터 전국 표가 '강원'과 '제주'를 분리 제공하는 경우 템플릿은 '강원/제주' 1행이라 합산 필요
# -----------------------------------------------------------------------------
지역합산:
  - from: ["강원", "제주"]
    to: "강원/제주"
